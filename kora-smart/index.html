<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كورة سمارت</title>
<meta name="description" content="احجز مكانك في مباراة كورة، اختر مركزك، وأضف حكم وتصوير وبث مباشر.">
<meta name="theme-color" content="#0b1410">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="كورة سمارت">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* IDEA: the floodlit five-a-side pitch at night — dark turf, chalk lines,
   one neon accent for "your place". Players pick a spot on a drawn pitch.
   LAYOUT: one phone column up to 560px, bottom tabs, sheets slide up. */
:root{
  color-scheme:dark;
  --bg:#0b1410;--p1:#122019;--p2:#182a21;--line:#24392e;
  --ink:#eef5f0;--mut:#93ab9e;--dim:#5f7a6c;
  --acc:#c8f23a;--acc-ink:#142000;
  --ok:#3ccf7d;--warn:#f5b83d;--bad:#ef6363;--info:#6cb8ff;
  --turf:#12301f;--turf2:#153824;--chalk:rgba(255,255,255,.55);
  --r:16px;--pad:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Cairo,system-ui,sans-serif;font-size:16px;line-height:1.55;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--pad) calc(96px + var(--safe-b))}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent);padding:14px var(--pad) 10px;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.2px;text-decoration:none;color:var(--ink)}
.brand svg{width:34px;height:34px}
.brand small{display:block;font-weight:600;font-size:12px;color:var(--mut);margin-top:-4px}
.top .sp{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;color:var(--mut);font-size:14px;cursor:pointer}
h1{font-size:24px;margin:8px 0 4px;font-weight:800}
h2{font-size:18px;margin:22px 0 10px;font-weight:700}
.sub{color:var(--mut);margin:0 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--p1);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--mut);cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 12px}
.match{display:block;text-decoration:none;color:inherit;cursor:pointer}
.match:active{transform:scale(.99)}
.mhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mtitle{font-weight:800;font-size:18px;margin:0}
.mwhen{color:var(--acc);font-weight:700;font-size:15px}
.mwhere{color:var(--mut);font-size:14px}
.price{text-align:left;white-space:nowrap}
.price b{font-size:22px;font-weight:800}
.price span{display:block;color:var(--mut);font-size:12px;margin-top:-4px}
.fill{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--p2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;border-radius:8px;padding:2px 8px;background:var(--p2);color:var(--mut);border:1px solid var(--line)}
.tag.on{color:var(--ink)}
.tag.live{color:#ff8a8a;border-color:#5a2a2a}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
/* pitch */
.pitchwrap{margin:6px 0 4px}
.pitch{width:100%;height:auto;display:block;border-radius:18px}
.slot{cursor:pointer}
.slot circle{transition:r .15s}
.slot:focus{outline:none}
.slot:focus-visible circle.ring{stroke:var(--acc);stroke-width:3}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mut);margin:8px 0 0;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
/* forms */
label.f{display:block;margin:0 0 12px}
label.f span{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=url],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin:0 0 10px;cursor:pointer;background:var(--bg)}
.check input{width:20px;height:20px;accent-color:var(--acc);margin-top:3px;flex:none}
.check b{display:block;font-weight:700}
.check small{color:var(--mut)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:17px;background:var(--acc);color:var(--acc-ink);cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--p2);color:var(--ink);border:1px solid var(--line)}
.btn.small{width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
.btn.ok{background:var(--ok);color:#03200f}
.btn.bad{background:transparent;color:var(--bad);border:1px solid #5a2a2a}
.btn.wa{background:#1f9d55;color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.lines{margin:6px 0 12px;border-top:1px dashed var(--line)}
.lines div{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;color:var(--mut)}
.lines div.t{color:var(--ink);font-weight:800;font-size:17px;border-top:1px dashed var(--line);margin-top:4px;padding-top:10px}
.err{color:var(--bad);font-size:14px;min-height:1.5em;margin:4px 0 8px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--p1);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:92dvh;overflow:auto;padding:10px var(--pad) calc(20px + var(--safe-b));animation:up .2s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@keyframes fade{from{opacity:0}}
/* pay */
.amount{font-size:44px;font-weight:800;letter-spacing:-1px;margin:0}
.amount small{font-size:18px;color:var(--mut);font-weight:700}
.copy{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px dashed var(--acc);border-radius:14px;padding:12px 14px;margin:8px 0}
.copy b{font-size:22px;letter-spacing:1px;direction:ltr}
.timer{display:inline-block;background:var(--p2);border-radius:10px;padding:4px 10px;font-weight:800;direction:ltr;color:var(--warn)}
.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0}
.steps li{counter-increment:s;position:relative;padding:0 34px 10px 0;color:var(--mut);font-size:14px}
.steps li::before{content:counter(s);position:absolute;right:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--p2);color:var(--ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;background:var(--p2)}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-held{color:var(--warn)}.s-paid{color:var(--info)}.s-confirmed{color:var(--ok)}
.s-rejected,.s-expired,.s-cancelled{color:var(--bad)}
.code{font-family:ui-monospace,monospace;direction:ltr;display:inline-block;letter-spacing:1px}
/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:rgba(11,20,16,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 0 calc(6px + var(--safe-b))}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--dim);font-size:12px;font-weight:700;padding:4px 0;position:relative}
nav.tabs a svg{display:block;margin:0 auto 2px;width:24px;height:24px}
nav.tabs a[aria-current=page]{color:var(--acc)}
.badge{position:absolute;top:0;left:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.toast{position:fixed;bottom:calc(84px + var(--safe-b));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:30;animation:up .2s;max-width:90vw;text-align:center}
.demo{background:#2a2410;border:1px solid #5a4a1a;color:#f5d98a;border-radius:12px;padding:10px 12px;font-size:13px;margin:6px 0 14px}
/* admin */
.atabs{display:flex;gap:6px;margin:6px 0 14px;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:4px}
.atabs button{flex:1;background:none;border:0;border-radius:10px;padding:8px 4px;color:var(--mut);font-weight:700;font-size:14px;cursor:pointer}
.atabs button[aria-pressed=true]{background:var(--p2);color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:8px 0 12px}
.kv dt{color:var(--mut)}.kv dd{margin:0}
.roster h3{font-size:15px;margin:14px 0 6px;color:var(--mut)}
.pl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl .who{flex:1;min-width:0}
.pl .who b{display:block}
.pl .who small{color:var(--mut)}
.pos{flex:none;width:44px;text-align:center;font-size:12px;font-weight:800;border-radius:8px;padding:3px 0;background:var(--p2)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.stat div{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--mut)}
.toggle3{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.toggle3 button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 0;font-weight:800;cursor:pointer;color:var(--mut)}
.toggle3 button[aria-pressed=true]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:28px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="كورة سمارت — الرئيسية">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#c8f23a"/><circle cx="32" cy="32" r="17" fill="#0b1410"/><path d="M32 22l8 6-3 9h-10l-3-9z" fill="#c8f23a"/><path d="M32 15v7M40 28l9-4M37 37l6 8M27 37l-6 8M24 28l-9-4" stroke="#c8f23a" stroke-width="2.4" stroke-linecap="round"/></svg>
    <span>كورة سمارت<small>احجز مكانك واختر مركزك</small></span>
  </a>
  <span class="sp"></span>
</header>
<main class="wrap" id="view" aria-live="polite"></main>
<nav class="tabs" aria-label="التنقل">
  <div class="in">
    <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/></svg>المباريات</a>
    <a href="#/mine" data-tab="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16v12H4z"/><path d="M8 3v4M16 3v4M4 11h16"/></svg>حجوزاتي</a>
    <a href="#/admin" data-tab="admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg>الإدارة<span class="badge" id="adminBadge" hidden></span></a>
  </div>
</nav>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
