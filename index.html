<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><!-- /frame-runtime -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dweekat Fitness</title>
<meta name="theme-color" content="#0e1015">
<meta name="description" content="Dweekat Fitness — مدربك الشخصي: برنامج تمارين، تقدّم، أكل وقياسات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a coach in your pocket — short, direct, energetic.
   IDEA: the gym whiteboard and the training-log card you tick off set by set.
   PICTURE: the looping exercise animation at the top of every step.
   COLOUR and TYPE: charcoal ground, orange accent, green for done, blue for cardio; Cairo.
   LAYOUT: one phone column up to 560px, bottom tabs, full-screen session flow. */
:root{color-scheme:dark;--bg:#0e1015;--p1:#191c23;--p2:#22262f;--line:#2e333e;--ink:#f2f2f5;--mute:#9a9eaa;--acc:#ff7a1a;--ok:#6ec878;--blue:#5aa0ff;--red:#ff5a46;--soft:#ffa86c}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Cairo,system-ui,sans-serif;overflow-x:clip}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:560px;margin:0 auto;padding:14px 16px 6px}
.brand{font-weight:800;font-size:22px;letter-spacing:.2px}.brand b{color:var(--acc)}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--p1);display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2}
h1{font-size:30px;line-height:1.1;margin:10px 0 4px;text-wrap:balance}
h2{font-size:24px;line-height:1.15;margin:6px 0 2px}
h3{font-size:18px;margin:18px 0 8px}
.mute{color:var(--mute)}.small{font-size:14px}
.card{background:var(--p1);border-radius:20px;padding:16px;margin:12px 0}
.hero{background:linear-gradient(160deg,#2a1a10,#191c23 60%);border:1px solid #3a2615}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--p2);font-size:14px;font-weight:600;white-space:nowrap}
.chip.acc{background:var(--acc);color:#14100c}.chip.ok{background:var(--ok);color:#0d1a10}.chip.blue{background:var(--blue);color:#0b1422}
.btn{min-height:48px;padding:10px 18px;border-radius:14px;background:var(--p2);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--acc);color:#16100a}.btn.ok{background:var(--ok);color:#0d1a10}.btn.wide{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.danger{background:#3a1714;color:#ffb3a8}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.day{background:var(--p1);border-radius:18px;padding:12px;text-align:start;border:2px solid transparent;min-height:104px;display:flex;flex-direction:column;gap:2px}
.day.next{border-color:var(--acc)}.day b{font-size:18px}.day .n{color:var(--acc);font-weight:800;font-size:13px}
.stat{background:var(--p2);border-radius:16px;padding:10px 12px}.stat b{display:block;font-size:22px;line-height:1.2}.stat span{font-size:13px;color:var(--mute)}
.tabs{position:fixed;inset-inline:0;bottom:0;background:#12141b;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;white-space:nowrap;font-weight:700;color:var(--mute)}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.tabs button[aria-current=page]{color:var(--acc)}
.hbtns{display:flex;gap:8px}#coachBtn.on{color:var(--acc)}
.tipc{display:flex;gap:12px;align-items:flex-start;border:1px solid #4a3418;background:linear-gradient(135deg,#231a10,var(--p1))}
.tipi{flex:none;width:40px;height:40px;border-radius:12px;background:#3a2612;display:grid;place-items:center;color:var(--acc)}
.tipi svg,.pi svg,.eq svg,#player button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .fl{fill:currentColor}
.tiph{display:flex;gap:12px;align-items:center}.tipx{font-size:18px;font-weight:700;line-height:1.6;margin:16px 0}
.meal-s .mi{list-style:none;margin:10px 0 6px;padding:0}.meal-s .mi li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.meal-s .mi b{color:var(--acc);white-space:nowrap}
.hs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}.hs .chip{min-height:38px;flex:none}
.chip.acc{background:var(--acc);color:#16100a}
.trks{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.trk{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-height:60px}
.trk img,.trk .pi{flex:none;width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--p2);display:grid;place-items:center;color:var(--mute)}
.trk .tt{flex:1;display:flex;flex-direction:column;min-width:0}.trk .tt b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trk .tt small{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .eq{color:var(--mute)}.trk.on{border-color:var(--acc);background:#251a10}.trk.on .eq{color:var(--acc)}
.qg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.trk.sq{min-height:52px}
.qn{flex:none;width:34px;height:34px;border-radius:10px;background:var(--p2);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--acc)}
.shows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.show{display:flex;flex-direction:column;text-align:start;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:8px;gap:2px}
.show img{width:100%;aspect-ratio:1;border-radius:10px;object-fit:cover;margin-bottom:6px}.show b{font-size:14px;line-height:1.3}.show small{font-size:12px;color:var(--mute)}
#player{position:fixed;inset-inline:8px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:15;max-width:544px;margin:0 auto;display:flex;align-items:center;gap:6px;background:#1e2129;border:1px solid var(--line);border-radius:16px;padding:6px 6px 6px 10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#player img,#player .pi{flex:none;width:40px;height:40px;border-radius:10px;object-fit:cover;background:var(--p2);display:grid;place-items:center;color:var(--acc)}
#player .pt{flex:1;display:flex;flex-direction:column;min-width:0;line-height:1.3}#player .pt b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#player .pt small{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#player button{flex:none;width:38px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}#player button.pp{background:var(--acc);color:#16100a}
body.sess #player{bottom:calc(10px + env(safe-area-inset-bottom))}
body.hasP .wrap{padding-bottom:calc(170px + env(safe-area-inset-bottom))}body.hasP #session .wrap{padding-bottom:90px!important}
label.f{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input.in,select.in,textarea.in{width:100%;min-height:48px;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
textarea.in{min-height:84px;resize:vertical}
.seg{display:flex;background:var(--p2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:700;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--acc);color:#16100a}
.opt{display:block;width:100%;text-align:start;background:var(--p1);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0}
.opt[aria-pressed=true]{border-color:var(--acc);background:#22170f}
.opt b{display:block;font-size:17px}
/* session */
#session{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.sbar{position:sticky;top:0;background:var(--bg);z-index:2;padding:10px 16px 8px;max-width:560px;margin:0 auto}
.prog{height:6px;background:var(--p2);border-radius:3px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.clip{position:relative;border-radius:20px;overflow:hidden;background:#0e1015;aspect-ratio:9/8;border:1px solid var(--line)}
.clip video{width:100%;height:100%;object-fit:cover;display:block}
.clip.pic{aspect-ratio:3/2;background:#fff}
.clip.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.clip.pic img+img{animation:exFrame 2.4s ease-in-out infinite}
@keyframes exFrame{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.clip.pic img+img{animation:none}}
.how{margin:12px 0;background:var(--p1);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.how summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"+";font-size:22px;line-height:1;color:var(--acc)}
.how[open] summary::after{content:"–"}
.how ol{margin:0;padding:0 14px 12px;list-style:none;counter-reset:h}
.how li{counter-increment:h;display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.how li::before{content:counter(h);flex:none;width:24px;height:24px;border-radius:8px;background:var(--p2);color:var(--acc);font-weight:800;display:grid;place-items:center;font-size:13px}
.exlib{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.exc{display:flex;flex-direction:column;text-align:start;background:var(--p1);border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0}
.exc img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:#fff}
.exc b{padding:8px 10px 0;font-size:14px;line-height:1.3}
.exc span{padding:0 10px 10px;font-size:12px;color:var(--mute)}
button.chip{cursor:pointer}
.clip .chip{position:absolute;bottom:10px;inset-inline-start:10px;background:rgba(14,16,21,.85);color:var(--soft)}
.targets{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sug{border-radius:14px;padding:10px 12px;font-weight:600;font-size:15px;background:var(--p2)}
.sug.up{background:#16301c;color:#b9f0c2}.sug.down{background:#36190f;color:#ffc6a8}
.cues{margin:10px 0;padding:0;list-style:none;counter-reset:c}
.cues li{counter-increment:c;display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.cues li::before{content:counter(c);flex:none;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#16100a;font-weight:800;display:grid;place-items:center;font-size:14px}
.sets{width:100%;border-collapse:separate;border-spacing:0 8px}
.sets th{font-size:13px;color:var(--mute);font-weight:600;text-align:center}
.sets td{text-align:center}
.sets td.n{font-weight:800;color:var(--mute);width:36px}
.sets input{width:100%;min-height:48px;text-align:center;background:var(--p2);border:1px solid var(--line);border-radius:12px;font-size:18px;font-weight:700}
.sets tr.done input{border-color:#2f5a36;background:#15231a}
.chk{width:52px;height:48px;border-radius:12px;background:var(--p2);display:grid;place-items:center;margin:auto}
.chk svg{width:24px;height:24px;stroke:var(--mute);fill:none;stroke-width:3}
tr.done .chk{background:var(--ok)}tr.done .chk svg{stroke:#0d1a10}
.list .it{display:flex;gap:12px;align-items:center;padding:12px;background:var(--p1);border-radius:14px;margin:8px 0;width:100%;text-align:start}
.it .box{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center}
.it[aria-pressed=true] .box{background:var(--ok);border-color:var(--ok)}
.it .box svg{width:18px;height:18px;stroke:#0d1a10;fill:none;stroke-width:3;opacity:0}.it[aria-pressed=true] .box svg{opacity:1}
.navb{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 12px;display:flex;gap:10px}
.navb .btn{flex:1}
table.ph{width:100%;border-collapse:collapse}table.ph td{padding:10px 8px;border-bottom:1px solid var(--line)}table.ph td:first-child{color:var(--blue);font-weight:800;white-space:nowrap}
.mc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0}
.mc .clip{aspect-ratio:9/8;border-radius:14px}
.mc figcaption{font-weight:700;font-size:14px;margin-top:4px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:44px;height:44px;border-radius:50%;background:var(--p2);border:2px solid var(--line);font-weight:800}
.dot[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#0d1a10}
.big{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;text-align:center}
.rpe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rpe button{min-height:44px;border-radius:12px;background:var(--p2);font-weight:800}
.rpe button[aria-pressed=true]{background:var(--acc);color:#16100a}
/* sheet + modal */
#sheet{position:fixed;inset-inline:0;bottom:0;z-index:20;transform:translateY(110%);visibility:hidden;transition:transform .25s,visibility 0s .25s}
#sheet.on{transform:none;visibility:visible;transition:transform .25s}
#sheet .in{max-width:560px;margin:0 auto;background:#1d2029;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.bar{height:8px;background:var(--p2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .in{width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:#1a1d25;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
#toast{position:fixed;top:calc(14px + env(safe-area-inset-top));inset-inline:16px;z-index:40;display:flex;justify-content:center;pointer-events:none}
#toast span{background:var(--ok);color:#0d1a10;font-weight:700;padding:10px 16px;border-radius:14px;opacity:0;transition:opacity .2s;max-width:520px}
#toast span.on{opacity:1}
/* macros */
.mac{margin:10px 0}.mac .row{justify-content:space-between;font-size:15px}.mac b{font-variant-numeric:tabular-nums}
.mac .bar i.p{background:var(--ok)}.mac .bar i.c{background:var(--blue)}.mac .bar i.f{background:#c9a3ff}.mac .bar i.o{background:var(--red)}
.meal{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.meal small{color:var(--mute);display:block}
/* chat */
.msgs{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;font-size:15px}
.msg.u{align-self:flex-end;background:var(--acc);color:#16100a;border-end-end-radius:4px}
.msg.a{align-self:flex-start;background:var(--p1);border-end-start-radius:4px}
.chat-in{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.chat-in textarea{min-height:48px;height:48px}
.fig{position:relative;min-height:220px;margin:6px 0}.fig>svg{position:absolute;inset:0;width:100%;height:100%;direction:ltr}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.hist{padding:10px 0;border-bottom:1px solid var(--line)}
.tiny{font-size:13px;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Dweekat <b>Fitness</b></div>
  <div class="hbtns"><button class="icon-btn" id="coachBtn" aria-label="coach"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8"/></svg></button><button class="icon-btn" id="gear" aria-label="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
</header>
<main class="wrap" id="view"><p class="mute">…</p></main>
<nav class="tabs" id="tabs"></nav>
<div id="player" hidden></div>
<div id="session" hidden></div>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="modal"><div class="in" id="modalIn"></div></div>
<div id="toast"><span id="toastS"></span></div>

<script>
{
/* ================= DATA ================= */
const EXD={
incline_db:{n:"Incline Dumbbell Press",s:4,r:[8,12],rest:90,inc:2,m:["أعلى الصدر","Upper chest"],sub:["ضغط دمبل على بنش مايل","Dumbbell press on an incline bench"],c:[["البنش على 30° — مش أكثر من 45°","Bench at 30° — never above 45°"],["لوحي الكتف لورا وصدرك مرفوع","Shoulder blades back, chest up"],["نزول 3 ثواني والكوع 45° عن جسمك","3-second lowering, elbows ~45° from your body"]]},

const LK="coachapp:v1";
const Store={mode:"local",db:null,uid:null,q:{},docs:{},
  lload(){try{return JSON.parse(localStorage.getItem(LK))||{}}catch(e){return {}}},
  lsave(){try{localStorage.setItem(LK,JSON.stringify(this.docs))}catch(e){}},
  ref(k){return this.db.collection("data/users/"+this.uid).doc(k)},
  put(k,v){this.docs[k]=v;this.lsave();if(this.mode!=="cloud")return;
    this.q[k]=(this.q[k]||Promise.resolve()).then(()=>this.ref(k).set(JSON.parse(JSON.stringify(v)))).catch(e=>this.fail(e))},
  del(k){delete this.docs[k];this.lsave();if(this.mode!=="cloud")return;
    this.q[k]=(this.q[k]||Promise.resolve()).then(()=>this.ref(k).delete()).catch(e=>this.fail(e))},
  fail(e){if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")){this.mode="local"}},
  async cloud(){
    return false;const C=null;
    try{
      const [db,user]=await Promise.all([C.use("db"),C.use("user")]);if(!db||!user)return false;
      const id=await user.id();if(!id)return false;
      if(user.can){const w=await user.can("data.write");if(w===false)return false}
      this.db=db;this.uid=id;
      const snap=await Promise.race([db.collection("data/users/"+id).get(),new Promise((_,j)=>setTimeout(()=>j({code:"timeout"}),10000))]);
      if(snap.size>0){const d={};snap.docs.forEach(x=>{d[x.id]=x.data()});this.docs=d;this.lsave();this.mode="cloud";return "loaded"}
      this.mode="cloud";const keys=Object.keys(this.docs);
      for(const k of keys){await this.ref(k).set(JSON.parse(JSON.stringify(this.docs[k])))}
      return true;
    }catch(e){this.mode="local";return false}
  }

function fromDocs(){
  const d=Store.docs;
  S.profile=d.profile?d.profile.p:null;
  S.progress=Object.assign({lastDay:0,mc:0,easy:0,hard:0,dismiss:0},d.profile&&d.profile.g||{});
  S.body=(d.body&&d.body.items)||[];
  S.chat=(d.chat&&d.chat.items)||[];
  S.food={};S.sessions=[];
  for(const k in d){if(k.startsWith("food-"))Object.assign(S.food,d[k].days||{});if(k.startsWith("s_"))S.sessions.push(d[k])}
  S.sessions.sort((a,b)=>a.start-b.start);
  try{S.active=JSON.parse(localStorage.getItem(LK+":active"))}catch(e){S.active=null}
}
const saveProfile=()=>Store.put("profile",{type:"profile",p:S.profile,g:S.progress});

  const last=S.sessions.slice(-6).map(s=>{const day=DAYS[s.day-1];const ex=Object.entries(s.ex||{}).map(([k,v])=>{const ds=(v.sets||[]).filter(x=>x.done);return EXD[k]?EXD[k].n+": "+ds.map(x=>(x.w??"")+"x"+x.r).join(", "):""}).filter(Boolean).join(" | ");return `${dkey(new Date(s.start))} Day${s.day} ${tr(day.n)} RPE ${s.rpe||"-"} feel ${s.feel||"-"} ${s.metcon?"Metcon "+s.metcon.ver+" "+(s.metcon.timeSec?mmss(s.metcon.timeSec):""):""} :: ${ex}`}).join("\n");
  const b=S.body.slice(-3).map(x=>`${x.date}: ${x.weight||"-"}kg, fat ${x.fat||"-"}%, muscle ${x.muscle||"-"}kg, visceral ${x.visceral||"-"}`).join("\n");
  const f=foodTotals(dkey());const tg=p.targets||{};
  return `PROFILE: name ${p.name||"-"}, level ${lv.n[1]}, goal ${p.goal||"-"}, weight ${p.weight||"-"}kg, height ${p.height||"-"}cm.
PROGRAM: 6-day cycle — 1 Push, 2 Pull, 3 Legs, 4 Upper, 5 Lower + Metcon (A Thunder/B Storm/C Volcano rotating), 6 Rest. Double progression: when all sets hit the top of the rep range, add weight. Current RIR target ${lv.rir}.
RECENT SESSIONS:\n${last||"none"}
BODY:\n${b||"none"}
FOOD TODAY: ${Math.round(f.kcal)} kcal, P ${Math.round(f.protein)}g, C ${Math.round(f.carbs)}g, Fiber ${Math.round(f.fiber)}g. Targets: ${tg.kcal||"-"} kcal, P ${tg.protein||"-"}g, C ${tg.carbs||"-"}g, Fiber ${tg.fiber||"-"}g.`;
}
const COACH_RULES=()=>`You are an experienced strength & conditioning and nutrition coach inside a gym app. Reply in ${L()==="ar"?"Arabic (friendly Levantine dialect; keep exercise names and technical terms in English)":"English"}. Be specific and practical, use the person's data below, keep it short (under 160 words) unless asked for detail. Use plain text with short lines or dashes, no markdown headings. You are not a doctor: for pain, injury, dizziness or medical conditions, tell them to stop and see a professional. Never suggest extreme diets or very low calories.`;

/* ================= NUTRITION ================= */
function foodTotals(day){const a=S.food[day]||[];return a.reduce((o,m)=>({kcal:o.kcal+(+m.kcal||0),protein:o.protein+(+m.protein||0),carbs:o.carbs+(+m.carbs||0),fiber:o.fiber+(+m.fiber||0)}),{kcal:0,protein:0,carbs:0,fiber:0})}
function autoTargets(p){const w=num(p.weight)||80;const k={cut:24,recomp:26,bulk:32}[p.goal||"recomp"];return {kcal:Math.round(w*k/10)*10,protein:Math.round(w*1.8),carbs:Math.round(w*(p.goal==="bulk"?3.5:2.3)),fiber:30}}

/* ================= TRAINING LOGIC ================= */
const lvl=()=>LV[(S.profile&&S.profile.level)||"int"];
const setsFor=(key,i)=>Math.max(2,EXD[key].s+lvl().adj(i));
const nextDayId=()=>(S.progress.lastDay%6)+1;
const mcVer=()=>METCON[S.progress.mc%3];
function lastEntry(key){for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].ex&&S.sessions[i].ex[key];if(e&&e.sets&&e.sets.some(s=>s.done))return {e,s:S.sessions[i]}}return null}
function suggest(key){
  const X=EXD[key],h=lastEntry(key),u=X.unit==="s"?t("sec"):t("kg");
  if(!h)return {type:"new",w:null,txt:t("sugNew",{hi:X.r[1]})};
  const ds=h.e.sets.filter(s=>s.done);const reps=ds.map(s=>+s.r||0);
  const lastTxt=ds.map(s=>X.unit==="s"?s.r+"s":((s.w??"–")+"×"+s.r)).join("  ");
  if(X.unit==="s"){const top=Math.max(...reps);const all=reps.length>=h.e.planned&&reps.every(r=>r>=X.r[1]);return {type:all?"up":"same",w:null,tgt:all?top+5:top,txt:all?t("sugUpT"):t("sugSameT"),last:lastTxt}}
  const w=Math.max(...ds.map(s=>+s.w||0));const avg=reps.reduce((a,b)=>a+b,0)/reps.length;
  const all=reps.length>=(h.e.planned||reps.length)&&reps.every(r=>r>=X.r[1])&&h.s.feel!=="hard";
  if(all&&w>0){const nw=r1(w+X.inc);return {type:"up",w:nw,txt:t("sugUp",{w:nw,u}),last:lastTxt}}
  if(avg<X.r[0]-1&&w>X.inc){const nw=r1(w-X.inc);return {type:"down",w:nw,txt:t("sugDown",{w:nw,u}),last:lastTxt}}
  return {type:"same",w:w||null,txt:w?t("sugSame",{w,u}):t("sugNew",{hi:X.r[1]}),last:lastTxt};
}
function buildSession(dayId){
  const day=DAYS[dayId-1];const steps=[{type:"warm"}];
  const ex={};
  day.ex.forEach((k,i)=>{steps.push({type:"ex",key:k,i});const sg=suggest(k);const n=setsFor(k,i);const X=EXD[k];
    const prev=lastEntry(k);
    ex[k]={planned:n,sets:Array.from({length:n},(_,j)=>({w:sg.w??(prev?prev.e.sets[j]?.w??null:null),r:X.unit==="s"?(sg.tgt||null):null,done:false}))}});
  if(day.cardio==="metcon")steps.push({type:"metcon"});else steps.push({type:"cardio"});
  steps.push({type:"finish"});
  const mv=mcVer();
  return {id:uid(),day:dayId,level:S.profile.level,start:Date.now(),idx:0,steps,ex,warm:[],cardioDone:false,
    metcon:day.cardio==="metcon"?{ver:mv.id,rounds:{},fin:{},timeSec:0}:null,stretch:[],rpe:null,feel:null,notes:""};
}

/* ---------- onboarding ---------- */
let OB={step:0,lang:"ar",name:"",level:"int",goal:"recomp",weight:""};
function renderOnboarding(){
  const v=$("#view");S.profile=S.profile||{lang:OB.lang};S.profile.lang=OB.lang;applyLang();
  const st=OB.step;let h=`<div class="card hero"><div class="tiny">${st+1} / 4</div>`;
  if(st===0)h+=`<h1>${t("obLang")}</h1><div class="seg" style="margin-top:12px"><button data-l="ar" aria-pressed="${OB.lang==="ar"}">العربية</button><button data-l="en" aria-pressed="${OB.lang==="en"}">English</button></div>`;
  if(st===1)h+=`<h1>${t("obName")}</h1><input class="in" id="obName" value="${esc(OB.name)}" autocomplete="given-name" style="margin-top:12px">`;
  if(st===2)h+=`<h1>${t("obLevel")}</h1>`+LVK.map(k=>`<button class="opt" data-lv="${k}" aria-pressed="${OB.level===k}"><b>${tr(LV[k].n)}</b><span class="mute small">${tr(LV[k].d)}</span></button>`).join("")+`<p class="tiny">${t("lvNote")}</p>`;
  if(st===3)h+=`<h1>${t("obGoal")}</h1>`+["cut","recomp","bulk"].map(g=>`<button class="opt" data-g="${g}" aria-pressed="${OB.goal===g}"><b>${t({cut:"gCut",recomp:"gRecomp",bulk:"gBulk"}[g])}</b></button>`).join("")+`<label class="f" for="obW">${t("obW")}</label><input class="in" id="obW" inputmode="decimal" value="${esc(OB.weight)}">`;
  h+=`<div class="row" style="margin-top:16px">${st>0?`<button class="btn ghost" id="obBack">${t("back")}</button>`:""}<button class="btn pri" id="obNext" style="flex:1">${st===3?t("go"):t("cont")}</button></div></div><p class="tiny">${t("disc")}</p>`;
  v.innerHTML=h;
  v.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.l){OB.lang=b.dataset.l;renderOnboarding()}
    if(b.dataset.lv){OB.level=b.dataset.lv;renderOnboarding()}
    if(b.dataset.g){OB.goal=b.dataset.g;OB.weight=$("#obW").value;renderOnboarding()}
    if(b.id==="obBack"){OB.step--;renderOnboarding()}
    if(b.id==="obNext"){
      if(st===1){OB.name=$("#obName").value.trim();if(!OB.name){$("#obName").focus();return}}
      if(st===3){OB.weight=$("#obW").value;const p={lang:OB.lang,name:OB.name,level:OB.level,goal:OB.goal,weight:num(OB.weight),height:null,done:true};p.targets=autoTargets(p);S.profile=p;saveProfile();if(p.weight)addBody({date:dkey(),weight:p.weight});v.onclick=null;TAB="train";render();return}
      OB.step++;renderOnboarding()}
  };
}

/* ---------- train ---------- */
function renderTrain(){
  const v=$("#view");v.onclick=null;const p=S.profile;const nd=DAYS[nextDayId()-1];
  const last7=S.sessions.filter(s=>Date.now()-s.start<7*864e5&&!s.rest);
  const vol7=last7.reduce((a,s)=>a+sessVolume(s),0);
  let h=`<h1>${t("hello",{n:esc(p.name)})}</h1><div class="row"><span class="chip">${t("level0",{l:tr(lvl().n)})}</span><span class="chip">${t("mcNext",{v:mcVer().id+" — "+tr(mcVer().n)})}</span></div>`;
  h+=`<div class="card tipc"><span class="tipi">${ICON.bulb}</span><div><div class="tiny">${t("tipT")}</div><div class="small">${esc(tr(tipToday()))}</div></div></div>`;
  if(S.active){const ad=DAYS[S.active.day-1];h+=`<div class="card hero"><b>${t("resume")}</b><p class="mute small">${t("resumeTxt",{d:t("dayN",{n:ad.id})+" — "+tr(ad.n)})}</p><button class="btn pri wide" id="resume">${t("resume")}</button></div>`}
  const pr=S.progress,lvKeys=LVK,li=lvKeys.indexOf(p.level);
  if(pr.easy>=3&&li<2&&pr.dismiss!==S.sessions.length)h+=`<div class="card" style="border:1px solid #2f5a36"><p style="margin:0 0 10px">${t("levelUp",{l:tr(LV[lvKeys[li+1]].n)})}</p><div class="row"><button class="btn ok" data-lvch="${lvKeys[li+1]}">${t("yes")}</button><button class="btn ghost" data-dismiss>${t("notNow")}</button></div></div>`;
  if(pr.hard>=3&&li>0&&pr.dismiss!==S.sessions.length)h+=`<div class="card" style="border:1px solid #5a2f2a"><p style="margin:0 0 10px">${t("levelDown",{l:tr(LV[lvKeys[li-1]].n)})}</p><div class="row"><button class="btn" data-lvch="${lvKeys[li-1]}">${t("yes")}</button><button class="btn ghost" data-dismiss>${t("notNow")}</button></div></div>`;
  h+=`<div class="card hero"><div class="tiny">${t("nextUp")}</div><h2>${t("dayN",{n:nd.id})} — ${esc(tr(nd.n))}</h2><p class="mute" style="margin:0 0 10px">${esc(tr(nd.d))}${nd.rest?"":" · "+t("exN",{n:nd.ex.length})+" · "+t("mins",{n:nd.min})}</p>`;
  if(nd.rest)h+=`<p class="small">${t("restTxt")}</p><button class="btn ok wide" id="logRest">${t("logRest")}</button>`;
  else h+=`<div class="row small mute" style="margin-bottom:12px">${nd.ex.map(k=>`<button class="chip" data-exi="${k}">${esc(EXD[k].n)}</button>`).join("")}</div><button class="btn pri wide" data-start="${nd.id}">${t("start")}</button>`;
  h+=`</div><div class="grid3"><div class="stat"><b>${last7.length}</b><span>${t("week")} · ${t("sessionsN")}</span></div><div class="stat"><b>${Math.round(vol7).toLocaleString("en")}</b><span>${t("volW")}</span></div><div class="stat"><b>${S.sessions.filter(s=>!s.rest).length}</b><span>${t("allS")}</span></div></div>`;
  h+=`<h3>${t("pickDay")}</h3><div class="grid2">`+DAYS.map(d=>{const ls=[...S.sessions].reverse().find(s=>s.day===d.id);return `<button class="day ${d.id===nd.id?"next":""}" data-start="${d.id}"><span class="n">${t("dayN",{n:d.id})}</span><b>${esc(tr(d.n))}</b><span class="small mute">${esc(tr(d.d))}</span><span class="tiny">${ls?t("lastDone",{d:ago(ls.start)}):t("never")}</span></button>`}).join("")+`</div><h3>${t("lib")}</h3><p class="small mute" style="margin-top:-6px">${t("libSub")}</p><div class="exlib">`+Object.keys(EXD).map(k=>`<button class="exc" data-exi="${k}"><img src="${IMG(k)}-1.jpg" alt="" loading="lazy"><b>${esc(EXD[k].n)}</b><span>${esc(tr(EXD[k].m))}</span></button>`).join("")+`</div><p class="tiny" style="margin-top:16px">${t("disc")}</p>`;
  v.innerHTML=h;
  v.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.exi)return exInfo(b.dataset.exi);
    if(b.id==="resume")return openSession();
    if(b.id==="logRest"){logRest();return}
    if(b.dataset.lvch){S.profile.level=b.dataset.lvch;S.progress.easy=0;S.progress.hard=0;saveProfile();toast(t("saveOk"));return renderTrain()}
    if(b.dataset.dismiss!==undefined){S.progress.dismiss=S.sessions.length;S.progress.easy=0;S.progress.hard=0;saveProfile();return renderTrain()}
    if(b.dataset.start){const id=+b.dataset.start;if(DAYS[id-1].rest){logRest();return}
      if(S.active&&S.active.day!==id){modal(`<h2>${t("exitT")}</h2><p class="mute">${t("resumeTxt",{d:t("dayN",{n:S.active.day})})}</p><div class="row"><button class="btn pri" id="mRes">${t("resume")}</button><button class="btn danger" id="mNew">${t("exitDiscard")}</button></div>`);
        $("#mRes").onclick=()=>{closeModal();openSession()};$("#mNew").onclick=()=>{closeModal();S.active=buildSession(id);saveActive();openSession()};return}
      if(!S.active){S.active=buildSession(id);saveActive()}openSession()}
  };
}
function logRest(){const s={id:uid(),day:6,rest:true,start:Date.now(),ex:{}};S.sessions.push(s);Store.put("s_"+s.id,Object.assign({type:"session"},s));S.progress.lastDay=6;saveProfile();toast(t("saveOk"));renderTrain()}
function sessVolume(s){let v=0;for(const k in s.ex||{}){if(EXD[k]&&EXD[k].unit==="s")continue;for(const x of s.ex[k].sets||[])if(x.done)v+=(+x.w||0)*(+x.r||0)*(EXD[k]&&EXD[k].side?2:1)}return v}

function vid(clip){return pic(clip)}
function howBox(k,open){const st=HOW[k];if(!st)return "";return `<details class="how"${open?" open":""}><summary>${t("howTo")}</summary><ol>${st.map(x=>`<li>${esc(tr(x))}</li>`).join("")}</ol></details>`}
function exInfo(k){const X=EXD[k];if(!X)return;const rr=X.r[0]===X.r[1]?X.r[0]:X.r[0]+"–"+X.r[1];modal(`<div class="row between"><h2 style="margin:0">${esc(X.n)}</h2><button class="icon-btn" id="exClose" aria-label="close">${ICON.x}</button></div><p class="mute" style="margin:4px 0 10px">${esc(tr(X.sub))}</p>${pic(k,tr(X.m))}<div class="targets"><span class="chip acc">${X.s} × ${rr}${X.unit==="s"?" "+t("sec"):""}</span><span class="chip ok">${t("rest",{n:X.rest})}</span></div>${howBox(k,true)}<h3 style="margin:14px 0 4px">${t("tipsT")}</h3><ol class="cues">${X.c.map(c=>`<li>${esc(tr(c))}</li>`).join("")}</ol>`);$("#exClose").onclick=closeModal}
function renderStep(){

    `</tbody></table><div class="row between"><button class="btn ghost" id="addSet">${t("addSet")}</button><span class="tiny" style="flex:1;text-align:end">${t("editHint")}</span></div>`}
  if(st.type==="cardio"){const c=CARDIO[day.cardio],lv=lvl();const rows=c.rows(lv);const mins=c.min||(5+lv.hiit*2);

  if(st.type==="metcon"){const mv=METCON.find(m=>m.id===a.metcon.ver),lv=lvl();
    h+=`<div class="tiny" style="margin-top:6px">Metcon — ${t("mins",{n:18})}</div><h2>${mv.id} — ${esc(tr(mv.n))}</h2><p class="mute" style="margin:0">${t("mcRule",{r:lv.mcR,l:lv.lap})}</p>`;

function finishSession(){
  const a=S.active;
  for(const k in a.ex){a.ex[k].sets=a.ex[k].sets.map(s=>({w:s.w,r:s.r,done:!!s.done}))}
  const prevBest={};for(const k in a.ex){let b=0;for(const s of S.sessions)for(const x of (s.ex&&s.ex[k]&&s.ex[k].sets)||[])if(x.done)b=Math.max(b,+x.w||0);prevBest[k]=b}
  const ses={type:"session",id:a.id,day:a.day,level:a.level,start:a.start,end:Date.now(),ex:a.ex,warm:a.warm.length,cardioDone:a.cardioDone,cardioSec:a.cardioSec||0,metcon:a.metcon,stretch:a.stretch.length,rpe:a.rpe,feel:a.feel,notes:a.notes};
  S.sessions.push(ses);Store.put("s_"+ses.id,ses);
  const pr=S.progress;pr.lastDay=a.day;if(a.metcon)pr.mc=(pr.mc+1)%3;
  if(a.feel==="easy"){pr.easy++;pr.hard=0}else if(a.feel==="hard"){pr.hard++;pr.easy=0}else{pr.easy=0;pr.hard=0}
  saveProfile();S.active=null;saveActive();SW={on:false,t0:0,acc:0};
  let sets=0,prs=0;for(const k in ses.ex){const ds=ses.ex[k].sets.filter(s=>s.done);sets+=ds.length;const mx=Math.max(0,...ds.map(s=>+s.w||0));if(prevBest[k]>0&&mx>prevBest[k])prs++}
  const dur=Math.round((ses.end-ses.start)/60000);
  stopRest();clearInterval(swT);
  SE.innerHTML=`<div class="wrap" style="padding-top:24px"><div class="card hero"><div class="tiny">${t("summary")}</div><h1>${t("saved")}</h1><div class="grid3" style="margin-top:12px"><div class="stat"><b>${dur}</b><span>${t("duration")} (${L()==="ar"?"د":"min"})</span></div><div class="stat"><b>${sets}</b><span>${t("setsDone")}</span></div><div class="stat"><b>${Math.round(sessVolume(ses)).toLocaleString("en")}</b><span>${t("volume")}</span></div></div>${prs?`<p style="margin:12px 0 0"><span class="chip ok">${t("prs")}: ${prs}</span></p>`:""}</div>
  <div class="card" id="fbBox"><b>${t("coachFb")}</b><p class="small" id="fbTxt" style="white-space:pre-wrap;margin:8px 0 0">${esc(sessionFeedback(ses,prs))}</p></div><button class="btn pri wide" id="goHome">${t("home")}</button></div>`;
  $("#goHome").onclick=()=>{TAB="train";closeSession()};winSfx();
  const fb=$("#fbGo");if(fb)fb.onclick=async()=>{fb.disabled=true;const out=$("#fbTxt");out.textContent=t("thinking");
    const day=DAYS[ses.day-1];const detail=Object.entries(ses.ex).map(([k,v])=>EXD[k].n+" (target "+EXD[k].r.join("-")+"): "+v.sets.filter(s=>s.done).map(s=>(s.w??"")+"x"+s.r).join(", ")).join("\n");
    try{const r=await AI(`${COACH_RULES()}\n\n${ctxText()}\n\nThe person just finished Day ${ses.day} ${tr(day.n)} in ${dur} min, RPE ${ses.rpe||"-"}, felt ${ses.feel||"-"}.\n${detail}\n${ses.metcon?"Metcon "+ses.metcon.ver+" time "+mmss(ses.metcon.timeSec):""}\nNotes: ${ses.notes||"-"}\n\nGive short post-session feedback: what went well, what to change next time (weights/reps), and one recovery or nutrition tip for today.`,{modelTier:"default",onText:({text})=>{out.textContent=text}});out.textContent=r.text}catch(e){out.textContent=t("aiErr");fb.disabled=false}};

/* ---------- charts ---------- */
function lineChart(box,series,unit){
  const s=document.createElementNS("http://www.w3.org/2000/svg","svg");box.innerHTML="";box.appendChild(s);
  const draw=()=>{const W=box.clientWidth,H=box.clientHeight;if(!W)return;const all=series.flatMap(x=>x.pts);if(!all.length){s.innerHTML="";return}
    const xs=all.map(p=>p.x),ys=all.map(p=>p.y);let x0=Math.min(...xs),x1=Math.max(...xs);if(x0===x1){x0-=864e5;x1+=864e5}let y0=Math.min(...ys),y1=Math.max(...ys);if(y0===y1){y0-=1;y1+=1}const py=(y1-y0)*0.15;y0-=py;y1+=py;
    const L_=44,R_=12,T_=14,B_=26;const X=x=>L_+(x-x0)/(x1-x0)*(W-L_-R_),Y=y=>T_+(1-(y-y0)/(y1-y0))*(H-T_-B_);
    let g=`<g font-size="12" fill="#9a9eaa" font-family="Cairo">`;for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${L_}" x2="${W-R_}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2e333e"/><text x="4" y="${Y(v)+4}">${r1(v)}</text>`}
    g+=`<text x="${L_}" y="${H-6}">${fmtD(x0)}</text><text x="${W-R_}" y="${H-6}" text-anchor="end">${fmtD(x1)}</text></g>`;
    for(const se of series){if(!se.pts.length)continue;const d=se.pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join("");g+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="3" stroke-linejoin="round"/>`+se.pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4" fill="${se.c}"/>`).join("")}
    s.setAttribute("viewBox",`0 0 ${W} ${H}`);s.innerHTML=g};
  const ro=new ResizeObserver(draw);ro.observe(box);draw();
}

const FQ={"واحد":1,"وحده":1,"وحد":1,"نص":0.5,"نصف":0.5,"ربع":0.25,"اثنين":2,"اتنين":2,"تنين":2,"ثنتين":2,"تنتين":2,"زوج":2,"ثلاث":3,"تلات":3,"ثلاثه":3,"تلاته":3,"اربع":4,"اربعه":4,"خمس":5,"خمسه":5,"ست":6,"سته":6,"سبع":7,"سبعه":7,"ثمان":8,"تمن":8,"تسع":9,"عشر":10,"عشره":10,"one":1,"half":0.5,"two":2,"three":3,"four":4,"five":5};
const FU=["رغيف","رغف","سيخ","شيخ","صحن","كاسه","كاس","كوب","حبه","حب","قطعه","قطع","ملعقه","علبه","سندويشه","شريحه","فنجان","سكوب","بيضه","تمره","موزه","تفاحه","وجبه"];
function fnorm(s){return String(s).toLowerCase().replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/٫/g,".")}
const FA=(()=>{const L=[];FOODS.forEach((f,i)=>f.a.forEach(a=>L.push({w:fnorm(a).split(/\s+/),i,gen:!!f.gen})));return L.sort((x,y)=>(x.gen-y.gen)||(y.w.join(" ").length-x.w.join(" ").length))})();
const FFIRST=new Set(FA.map(x=>x.w[0]));
function ftok(w){ // strip the article / attached "w-" and "b-" when what's left is a food word
  for(const pre of ["وبال","بال","وال","لل","ال"]){if(w.startsWith(pre)&&w.length-pre.length>=2&&FFIRST.has(w.slice(pre.length)))return w.slice(pre.length)}
  if(/^[وب]/.test(w)&&w.length>3&&FFIRST.has(w.slice(1)))return w.slice(1);
  if(w.startsWith("ال")&&w.length>4)return w.slice(2);return w}
function fqty(tokens){let q=null,g=null;
  for(let j=0;j<tokens.length;j++){const w=tokens[j];
    const m=w.match(/^(\d+(?:\.\d+)?)(غ|غم|غرام|جرام|جم|g|gr)?$/);
    if(m){const n=+m[1],nx=tokens[j+1]||"";if(m[2]||/^(غ|غم|غرام|جرام|جم|g|gr|grams?)$/.test(nx))g=n;else if(q===null)q=n;continue}
    if(FQ[w]!==undefined&&q===null){q=FQ[w];continue}
    if(q===null&&w.length>3){let st=null;if(w.endsWith("تين"))st=w.slice(0,-3);else if(w.endsWith("ين"))st=w.slice(0,-2);
      if(st&&FU.some(u=>u.replace(/ه$/,"")===st))q=2}}
  return {q,g}}
function localEstimate(txt){
  const segs=fnorm(txt).replace(/[+،,;؛\n\/]/g," | ").split(/\s+/).map(ftok).join(" ").split(/\s+(?:\||مع|و|and|with|plus)\s+|\s*\|\s*/).map(s=>s.trim()).filter(Boolean);
  const items=[],miss=[];
  segs.forEach(seg=>{const tk=seg.split(/\s+/).filter(Boolean),used=new Array(tk.length).fill(false),hits=[];
    for(const al of FA){if(al.gen&&hits.length)break;
      for(let s=0;s+al.w.length<=tk.length;s++){let ok=true,du=false;for(let j=0;j<al.w.length;j++){const w=tk[s+j],a=al.w[j];if(used[s+j]){ok=false;break}
          if(w===a||(a.length>=3&&(w===a+"s"||w===a+"ات")))continue;
          if(a.length>=3&&(w===a+"ين"||w===a.replace(/ه$/,"")+"تين")){du=true;continue}ok=false}
        if(ok&&!hits.some(h=>h.i===al.i||(FOODS[al.i].fam&&FOODS[h.i].fam===FOODS[al.i].fam))){for(let j=0;j<al.w.length;j++)used[s+j]=true;hits.push({i:al.i,pos:s,du});break}}}
    if(!hits.length){if(!tk.every(w=>/^\d/.test(w)||FQ[w]!==undefined))miss.push(seg);return}
    hits.sort((a,b)=>a.pos-b.pos);const {q,g}=fqty(tk.filter((_,j)=>!used[j]));
    hits.forEach((h,n)=>{const F=FOODS[h.i];let m=h.du?2:1;if(n===0){if(g)m=g/F.g;else if(q)m=q}
      const lbl=tr(F.n)+(g&&n===0?` — ${g}${t("gU")}`:(m!==1?` × ${+m.toFixed(2)}`:""));
      items.push({name:lbl,kcal:F.k*m,protein:F.p*m,carbs:F.c*m,fiber:F.f*m})})});
  return {items,miss}}
function renderFood(){
  const v=$("#view");const tg=S.profile.targets||autoTargets(S.profile);const tot=foodTotals(FD);const meals=S.food[FD]||[];
  const bar=(k,cls,u)=>{const val=tot[k],tv=tg[k]||0;const pct=tv?Math.min(100,val/tv*100):0;const ov=tv&&val>tv*1.05&&k==="kcal";return `<div class="mac"><div class="row"><span>${t(k)}</span><b>${Math.round(val)} / ${tv} ${u}</b></div><div class="bar"><i class="${ov?"o":cls}" style="width:${pct}%"></i></div><div class="tiny">${tv?(val<=tv?t("left",{n:Math.round(tv-val)+" "+u}):t("over",{n:Math.round(val-tv)+" "+u})):""}</div></div>`};
  const d=new Date(FD);
  let h=`<div class="row between"><button class="icon-btn" data-fd="-1" aria-label="prev">${L()==="ar"?"›":"‹"}</button><h2 style="margin:0">${FD===dkey()?t("foodT"):fmtD(FD)}</h2><button class="icon-btn" data-fd="1" aria-label="next" ${FD===dkey()?"disabled":""}>${L()==="ar"?"‹":"›"}</button></div>`;
  h+=`<div class="card">${bar("kcal","",t("kcalU"))}${bar("protein","p",t("gU"))}${bar("carbs","c",t("gU"))}${bar("fiber","f",t("gU"))}</div>`;
  h+=`<div class="card"><label class="f" for="fTxt">${t("whatAte")}</label><textarea class="in" id="fTxt"></textarea><button class="btn pri wide" id="fEst" style="margin-top:10px">${t("estimate")}</button><p class="tiny">${t(AI?"estAI":"estLocal")}</p><div id="estBox"></div><button class="btn ghost wide" id="fMan" style="margin-top:10px">${t("manual")}</button><div id="manBox"></div></div>`;
  h+=`<div class="card">${meals.length?meals.map(m=>`<div class="meal"><div><b>${esc(m.name)}</b><small>${Math.round(m.kcal)} ${t("kcalU")} · P ${Math.round(m.protein)} · C ${Math.round(m.carbs)} · F ${Math.round(m.fiber)}</small></div><button class="btn ghost" data-delm="${m.id}">${t("del")}</button></div>`).join(""):`<p class="mute">${t("noData")}</p>`}</div>`;
  v.innerHTML=h;
  if(MAN)showManual();if(EST)showEst();
  v.onclick=async e=>{const b=e.target.closest("button");if(!b)return;

const MSH={b:0.25,l:0.35,d:0.25,s:0.15},MLB={b:"mB",l:"mL",d:"mD",s:"mS"};
const hsh=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
function mSwaps(){try{const o=JSON.parse(localStorage.getItem(LK+":msw"));if(o&&o.d===dkey())return o.s}catch(e){}return {b:0,l:0,d:0,s:0}}
function mealPlan(){const tg=S.profile.targets||autoTargets(S.profile),sw=mSwaps();
  return ["b","l","d","s"].map(k=>{const L=MEALT[k],tpl=L[(hsh(dkey()+k)+(sw[k]||0))%L.length];
    const base=tpl.reduce((a,[al,q])=>a+FOODS[fi(al)].k*q,0),want=tg.kcal*MSH[k];
    const f=Math.min(2.5,Math.max(0.5,Math.round(want/base*4)/4));
    const items=tpl.map(([al,q])=>({i:fi(al),q:Math.max(0.5,Math.round(q*f*2)/2)}));
    const sum=x=>items.reduce((a,it)=>a+FOODS[it.i][x]*it.q,0);
    return {key:k,lbl:MLB[k],items,k:sum("k"),p:sum("p"),c:sum("c"),f:sum("f"),want}})}
function renderMeals(){const v=$("#view"),p=S.profile,tg=p.targets||autoTargets(p),mp=mealPlan();
  const tot=mp.reduce((a,m)=>a+m.k,0),tp=mp.reduce((a,m)=>a+m.p,0);
  let h=`<h1>${t("mealsT")}</h1><p class="small mute" style="margin-top:-6px">${t("mealsSub",{w:p.weight||"—",k:tg.kcal,p:tg.protein})}</p>`;
  h+=`<div class="grid3"><div class="stat"><b>${Math.round(tot)}</b><span>${t("kcalU")}</span></div><div class="stat"><b>${Math.round(tp)}</b><span>${t("protein")} (${t("gU")})</span></div><div class="stat"><b>${fmtD(Date.now())}</b><span>${t("mNew")}</span></div></div>`;
  h+=mp.map(m=>`<div class="card meal-s"><div class="row between"><h3 style="margin:0">${t(m.lbl)}</h3><span class="chip acc">${Math.round(m.k)} ${t("kcalU")}</span></div><ul class="mi">${m.items.map(it=>`<li><span>${esc(tr(FOODS[it.i].n))}</span><b>× ${it.q}</b></li>`).join("")}</ul><div class="tiny">P ${Math.round(m.p)} · C ${Math.round(m.c)} · F ${Math.round(m.f)}</div><div class="row" style="margin-top:10px"><button class="btn ghost" data-msw="${m.key}" style="flex:1">${t("swap")}</button><button class="btn ok" data-madd="${m.key}" style="flex:1">${t("addMine")}</button></div></div>`).join("");
  h+=`<p class="tiny">${t("mNote")}</p>`;
  v.innerHTML=h;
  v.onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.msw){const s=mSwaps();s[b.dataset.msw]=(s[b.dataset.msw]||0)+1;try{localStorage.setItem(LK+":msw",JSON.stringify({d:dkey(),s}))}catch(x){}tapSfx();return renderMeals()}
    if(b.dataset.madd){const m=mp.find(x=>x.key===b.dataset.madd);FD=dkey();addMeals([{id:uid(),name:t(m.lbl)+": "+m.items.map(it=>tr(FOODS[it.i].n).replace(/ \(.+\)/,"")+(it.q!==1?" ×"+it.q:"")).join(" + "),kcal:Math.round(m.k),protein:Math.round(m.p),carbs:Math.round(m.c),fiber:Math.round(m.f),t:Date.now()}]);b.disabled=true;b.textContent="✓"}}}

const AUD=new Audio();AUD.preload="none";
let PL={q:[],i:-1};
function playQ(q,i){PL={q,i};playCur()}
function playCur(){const it=PL.q[PL.i];if(!it)return;AUD.src=it.url;AUD.play().catch(()=>{});drawPlayer();mMeta(it);if(TAB==="media")markPlaying()}
function pAct(a){if(a==="tog"){if(AUD.paused)AUD.play().catch(()=>{});else AUD.pause()}
  else if(a==="next"){if(PL.i<PL.q.length-1){PL.i++;playCur()}}
  else if(a==="prev"){if(AUD.currentTime>5||PL.i<=0)AUD.currentTime=0;else{PL.i--;playCur()}}
  else if(a==="x"){AUD.pause();AUD.removeAttribute("src");AUD.load();PL={q:[],i:-1};drawPlayer();if(TAB==="media")markPlaying()}}
AUD.addEventListener("ended",()=>{if(PL.i<PL.q.length-1){PL.i++;playCur()}else drawPlayer()});
AUD.addEventListener("play",()=>drawPlayer());AUD.addEventListener("pause",()=>drawPlayer());
AUD.addEventListener("error",()=>{if(PL.q[PL.i]&&AUD.getAttribute("src"))toast(t("mErr"))});
function drawPlayer(){const P=$("#player"),it=PL.q[PL.i];if(!it){P.hidden=true;document.body.classList.remove("hasP");return}
  P.hidden=false;document.body.classList.add("hasP");
  P.innerHTML=`${it.art?`<img src="${esc(it.art)}" alt="" onerror="this.remove()">`:`<span class="pi">${ICON.media}</span>`}<div class="pt"><b>${esc(it.t)}</b><small>${esc(it.sub||"")}</small></div><button data-pa="prev" aria-label="prev">${ICON.prev}</button><button data-pa="tog" class="pp" aria-label="play">${AUD.paused?ICON.play:ICON.pause}</button><button data-pa="next" aria-label="next">${ICON.next}</button><button data-pa="x" aria-label="close">${ICON.x}</button>`}
$("#player").addEventListener("click",e=>{const b=e.target.closest("[data-pa]");if(b)pAct(b.dataset.pa)});
function mMeta(it){try{if(!("mediaSession" in navigator))return;navigator.mediaSession.metadata=new MediaMetadata({title:it.t,artist:it.sub||"Dweekat Fitness",artwork:[{src:it.art||"icons/icon-512.png",sizes:"512x512"}]});
  navigator.mediaSession.setActionHandler("nexttrack",()=>pAct("next"));navigator.mediaSession.setActionHandler("previoustrack",()=>pAct("prev"));
  navigator.mediaSession.setActionHandler("play",()=>pAct("tog"));navigator.mediaSession.setActionHandler("pause",()=>pAct("tog"))}catch(e){}}
const MC={get(k){try{const o=JSON.parse(localStorage.getItem(LK+":mc:"+k));if(o&&o.d===dkey())return o.v}catch(e){}return null},set(k,v){try{localStorage.setItem(LK+":mc:"+k,JSON.stringify({d:dkey(),v}))}catch(e){}}};
async function jget(url,ms=9000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(tm)}}
function jsonp(url,ms=12000){return new Promise((res,rej)=>{const cb="__jp"+Math.random().toString(36).slice(2),s=document.createElement("script");const tm=setTimeout(()=>{clean();rej("timeout")},ms);
  function clean(){clearTimeout(tm);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()}window[cb]=d=>{clean();res(d)};s.onerror=()=>{clean();rej("err")};s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;document.head.appendChild(s)})}

const ALL114=Array.from({length:114},(_,i)=>i+1);
const QFB=[["مشاري راشد العفاسي","https://server8.mp3quran.net/afs/"],["ماهر المعيقلي","https://server12.mp3quran.net/maher/"],["عبدالباسط عبدالصمد","https://server7.mp3quran.net/basit/"],["سعد الغامدي","https://server7.mp3quran.net/s_gmd/"],["عبدالرحمن السديس","https://server11.mp3quran.net/sds/"],["ياسر الدوسري","https://server11.mp3quran.net/yasser/"],["ناصر القطامي","https://server6.mp3quran.net/qtm/"],["محمود خليل الحصري","https://server13.mp3quran.net/husr/"],["أحمد بن علي العجمي","https://server10.mp3quran.net/ajm/"],["فارس عباد","https://server8.mp3quran.net/frs_a/"],["سعود الشريم","https://server7.mp3quran.net/shur/"]].map(([n,s])=>({n,s,l:ALL114}));
const QFAV=["العفاسي","المعيقلي","عبدالباسط","الغامدي","السديس","الدوسري","القطامي","الحصري","العجمي","عباد","الشريم","المنشاوي","اسلام صبحي","الطبلاوي"];
async function reciters(){const c=MC.get("qr");if(c)return c;
  try{const d=await jget("https://mp3quran.net/api/v3/reciters?language=ar");const list=[];
    for(const r of d.reciters||[]){const ms=r.moshaf||[],m=ms.find(x=>/حفص/.test(x.name||"")&&/مرتل/.test(x.name||""))||ms.find(x=>/حفص/.test(x.name||""))||ms[0];if(!m||!m.server)continue;
      list.push({n:r.name,s:String(m.server).replace(/^http:/,"https:"),l:String(m.surah_list||"").split(",").map(Number).filter(Boolean)})}
    const rank=x=>{const nn=fnorm(x.n).replace(/\s/g,"");const i=QFAV.findIndex(f=>nn.includes(fnorm(f).replace(/\s/g,"")));return i<0?99:i};
    list.sort((a,b)=>rank(a)-rank(b)||a.n.localeCompare(b.n,"ar"));
    if(list.length){MC.set("qr",list);return list}}catch(e){}
  return QFB}
/* podcasts: Apple Podcasts directory, newest episodes first */
const PCATS=[["fit",["رياضة وصحة","Sport & health"],["رياضة","لياقة","تغذية","صحة"]],["self",["تطوير الذات","Self-growth"],["تطوير الذات","تحفيز","نجاح"]],["top",["منوعات","Popular"],["ثمانية","بودكاست عربي","فنجان"]]];
async function episodes(id,n){const d=await jsonp(`https://itunes.apple.com/lookup?id=${id}&entity=podcastEpisode&limit=${n}&country=sa`);
  return (d.results||[]).filter(x=>x.wrapperType==="podcastEpisode"&&x.episodeUrl).map(x=>({t:x.trackName,sub:x.collectionName,url:String(x.episodeUrl).replace(/^http:/,"https:"),art:x.artworkUrl160||x.artworkUrl60||"",d:Date.parse(x.releaseDate)||0}))}
async function podcasts(cat){const ck="p_"+cat,c=MC.get(ck);if(c)return c;const C=PCATS.find(x=>x[0]===cat),shows=new Map();
  await Promise.all(C[2].map(async term=>{try{const d=await jsonp(`https://itunes.apple.com/search?media=podcast&country=sa&limit=12&term=${encodeURIComponent(term)}`);(d.results||[]).forEach(r=>{if(r.collectionId&&!shows.has(r.collectionId))shows.set(r.collectionId,{id:r.collectionId,n:r.collectionName,a:r.artistName,art:r.artworkUrl100||r.artworkUrl60||""})})}catch(e){}}));
  const list=[...shows.values()].slice(0,16),eps=[];
  await Promise.all(list.slice(0,10).map(async s=>{try{const e=await episodes(s.id,4);s.last=e[0]?e[0].d:0;eps.push(...e)}catch(e){}}));
  eps.sort((a,b)=>b.d-a.d);list.sort((a,b)=>(b.last||0)-(a.last||0));const v={shows:list,eps:eps.slice(0,30)};if(list.length)MC.set(ck,v);return v}
